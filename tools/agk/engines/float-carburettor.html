<body>
  <div id="__bundler_placeholder">Loading Float carburettor — interactive lesson...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amber and jet form a U-tube<\u002Ftext>\n<\u002Fg>\n<\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #DCE3EA; border-radius: 16px; padding: 20px; display: flex; flex-wrap: wrap; gap: 28px\">\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; color: #0F172A\">Cockpit controls<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; align-items: baseline\">\n<label for=\"carb-thr\" style=\"font-size: 16px; font-weight: 700\">Throttle<\u002Flabel>\n<span style=\"font-size: 15px; font-weight: 600; color: #0F172A\">{{thrLabel}}<\u002Fspan>\n<\u002Fdiv>\n<input id=\"carb-thr\" class=\"rng thr\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{thr}}\" sc-camel-on-change=\"{{onThr}}\">\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; color: #5B6573\"><span>Closed (idle)<\u002Fspan><span>Full open<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 13.5px; color: #334155\">Moves: butterfly · accelerator pump (rapid opening) · economiser (near full)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; align-items: baseline\">\n<label for=\"carb-mix\" style=\"font-size: 16px; font-weight: 700\">Mixture<\u002Flabel>\n<span style=\"font-size: 15px; font-weight: 600; color: #B91C1C\">{{mixLabel}}<\u002Fspan>\n<\u002Fdiv>\n<input id=\"carb-mix\" class=\"rng mix\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{mix}}\" sc-camel-on-change=\"{{onMix}}\">\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; color: #5B6573\"><span>Idle cut-off<\u002Fspan><span>Full rich<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 13.5px; color: #334155\">Moves: the mixture needle in the main metering jet<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; align-items: baseline\">\n<label for=\"carb-alt\" style=\"font-size: 16px; font-weight: 700\">Pressure altitude<\u002Flabel>\n<span style=\"font-size: 15px; font-weight: 600; color: #1D4ED8\">{{altLabel}}<\u002Fspan>\n<\u002Fdiv>\n<input id=\"carb-alt\" class=\"rng alt\" type=\"range\" min=\"0\" max=\"10000\" step=\"500\" value=\"{{alt}}\" sc-camel-on-change=\"{{onAlt}}\">\n<div style=\"display: flex; justify-content: space-between; font-size: 13px; color: #5B6573\"><span>Sea level<\u002Fspan><span>10,000 ft<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" class=\"btn {{engCls}}\" sc-camel-on-click=\"{{toggleEng}}\" aria-pressed=\"{{engPressed}}\">{{engText}}<\u002Fbutton>\n<button type=\"button\" class=\"btn primary\" sc-camel-on-click=\"{{snap}}\">Snap throttle open<\u002Fbutton>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{toggleLabels}}\" aria-pressed=\"{{labelsPressed}}\">{{labelsText}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; color: #0F172A\">What the carburettor is doing<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0\">\n<div style=\"font-size: 17px; font-weight: 700; color: {{statusColor}}\">{{status}}<\u002Fdiv>\n<div style=\"font-size: 14px; line-height: 1.45; color: #334155\">{{statusSub}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"font-weight: 600\">Airflow<\u002Fspan><span>{{airPct}} %<\u002Fspan><\u002Fdiv>\n<div style=\"height: 10px; border-radius: 5px; background: #E5E9EF; overflow: hidden\"><div style=\"height: 10px; width: {{airPct}}%; background: #3B82F6; transition: width .3s\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span style=\"font-weight: 600\">Venturi depression<\u002Fspan><span>{{dpPct}} %<\u002Fspan><\u002Fdiv>\n<div style=\"height: 10px; border-radius: 5px; background: #E5E9EF; overflow: hidden\"><div style=\"height: 10px; width: {{dpPct}}%; background: #1D4ED8; transition: width .3s\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px\">\n<span style=\"font-size: 14px; font-weight: 600\">Air / fuel ratio (by weight)<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums\">{{afrText}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: relative; height: 34px\">\n<div style=\"position: absolute; left: 0; right: 0; top: 10px; height: 14px; display: flex; border-radius: 7px; overflow: hidden\">\n<div style=\"width: 12.5%; background: #1E3A8A\"><\u002Fdiv>\n<div style=\"width: 18.75%; background: #3B82F6\"><\u002Fdiv>\n<div style=\"width: 15.625%; background: #93C5FD\"><\u002Fdiv>\n<div style=\"width: 12.5%; background: #E5E7EB\"><\u002Fdiv>\n<div style=\"width: 9.375%; background: #FDBA74\"><\u002Fdiv>\n<div style=\"width: 18.75%; background: #F97316\"><\u002Fdiv>\n<div style=\"width: 12.5%; background: #9A3412\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: absolute; top: 0; left: {{afrPos}}%; width: 4px; height: 34px; margin-left: -2px; border-radius: 2px; background: #0F172A; opacity: {{afrMarkOp}}; transition: left .35s\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; height: 16px; font-size: 12px; color: #475569\">\n<span style=\"position: absolute; left: 12.5%; transform: translateX(-50%)\">8<\u002Fspan>\n<span style=\"position: absolute; left: 31.25%; transform: translateX(-50%)\">11<\u002Fspan>\n<span style=\"position: absolute; left: 46.875%; transform: translateX(-50%)\">13.5<\u002Fspan>\n<span style=\"position: absolute; left: 59.375%; transform: translateX(-50%)\">15.5<\u002Fspan>\n<span style=\"position: absolute; left: 68.75%; transform: translateX(-50%)\">17<\u002Fspan>\n<span style=\"position: absolute; left: 87.5%; transform: translateX(-50%)\">20<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; font-size: 12.5px; color: #475569\"><span>← richer<\u002Fspan><span style=\"font-weight: 600; color: #0F172A\">{{zoneName}}<\u002Fspan><span>leaner →<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"6\">\n<span class=\"{{c.cls}}\"><span class=\"led\"><\u002Fspan>{{c.name}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<aside style=\"flex: 1 1 380px; min-width: 0; background: #0F172A; color: #E2E8F0; border-radius: 16px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7DD3FC\">{{kicker}}<\u002Fspan>\n<span style=\"font-size: 13px; color: #94A3B8\">Step {{stepNo}} of {{stepCount}}<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 26px; line-height: 1.2; color: #FFFFFF\">{{title}}<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7DD3FC\">{{r.k}}<\u002Fdiv>\n<div style=\"font-size: 15.5px; line-height: 1.55; color: #E2E8F0\">{{r.v}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{hasExam}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"border: 1px solid #334155; background: #1E293B; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #FCD34D\">Exam keys · question bank<\u002Fdiv>\n<sc-for list=\"{{keys}}\" as=\"x\" hint-placeholder-count=\"2\">\n<div style=\"font-size: 14.5px; line-height: 1.5; color: #CBD5E1\"><span style=\"font-weight: 700; color: #FCD34D\">{{x.id}}<\u002Fspan> {{x.q}} <span style=\"font-weight: 600; color: #FFFFFF\">→ {{x.a}}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"border: 1px solid #0C4A6E; background: #082F49; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7DD3FC\">Try it<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5; color: #E0F2FE\">{{tryIt}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 10px\">\n<button type=\"button\" class=\"btn ghost\" sc-camel-on-click=\"{{prev}}\" disabled=\"{{atStart}}\" style=\"flex: 1 1 0\">← Back<\u002Fbutton>\n<button type=\"button\" class=\"btn primary\" sc-camel-on-click=\"{{next}}\" disabled=\"{{atEnd}}\" style=\"flex: 2 1 0\">Next →<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\" aria-label=\"Lesson steps\">\n<sc-for list=\"{{dots}}\" as=\"d\" hint-placeholder-count=\"14\">\n<button type=\"button\" class=\"{{d.cls}}\" sc-camel-on-click=\"{{d.go}}\" aria-label=\"{{d.aria}}\" title=\"{{d.aria}}\">{{d.n}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Faside>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1200}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { step: 0, eng: true, thr: 55, mix: 100, alt: 0, pumpOn: false, labels: true };\n    this.hist = [];\n    this.timers = [];\n    this.STEPS = [\n      { kicker: \"Overview\", title: \"What a carburettor does\", hl: [], sc: { eng: true, thr: 55, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A float-type carburettor mixes fuel into the induction air in proportion to the airflow the engine draws in. In this updraft design air enters at the bottom, speeds up through the venturi, passes the throttle butterfly and goes to the inlet manifold.\" },\n          { k: \"When it works\", v: \"All the time the engine runs. The pilot has only two inputs: the THROTTLE (how much mixture) and the MIXTURE lever (how much fuel for that air). Everything else is automatic.\" },\n          { k: \"Why it matters\", v: \"Petrol only burns between about 8:1 (rich limit) and 20:1 (weak limit) air/fuel by weight. The carburettor has to hold the ratio inside that band from idle to full power, at any altitude.\" }\n        ],\n        keys: [\n          { id: 'Q50', q: 'Main function of a carburettor', a: 'supply a correct fuel-air mixture at all speeds.' },\n          { id: 'Q71', q: 'Primary reason for suction in the carburettor', a: 'the pressure difference between atmospheric pressure and the pressure inside the cylinder.' },\n          { id: 'Q128', q: 'What makes the mixture enter the cylinders in cruise', a: 'the difference between ambient pressure and pressure inside the cylinder.' }\n        ],\n        tryIt: \"Use Next to walk through each component. You can move the levers under the diagram at any time.\" },\n      { kicker: \"Fuel supply\", title: \"Fuel inlet and filter\", hl: [\"inlet\", \"filter\"], sc: { eng: true, thr: 55, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"Fuel arrives under pressure from the engine-driven pump (or by gravity in simple installations) and passes through the inlet filter before it reaches the needle valve.\" },\n          { k: \"When it works\", v: \"Whenever the needle valve is open, i.e. whenever fuel is being used.\" },\n          { k: \"Why it matters\", v: \"The filter stops dirt and debris that would hold the needle valve open or block the small calibrated jets.\" }\n        ],\n        keys: [\n          { id: 'Q168', q: 'Position of a carburettor fuel strainer', a: 'upstream of the needle valve.' }\n        ],\n        tryIt: \"Watch the white dashes in the inlet: fuel only moves when the needle valve lifts off its seat.\" },\n      { kicker: \"Constant fuel level\", title: \"Float chamber, float and needle valve\", hl: [\"chamber\", \"float\", \"needle\"], sc: { eng: true, thr: 75, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"The float chamber is a small fuel reservoir. A float on the fuel surface works the needle valve through a lever: float up → needle closes; float down → needle opens.\" },\n          { k: \"When it works\", v: \"Continuously. Fuel used → level drops → float falls → needle lifts and admits fuel → level restored → needle closes. In steady flight it sits partly open.\" },\n          { k: \"Why it matters\", v: \"Fuel metering depends on the height of the fuel below the jet lip, so the level must stay constant. Too high → rich mixture or flooding; too low → weak mixture.\" }\n        ],\n        keys: [\n          { id: 'Table', q: 'Job of the float + needle valve', a: 'keep a constant fuel level in the float chamber.' },\n          { id: 'Q168', q: 'Position of the fuel strainer', a: 'upstream of the needle valve.' }\n        ],\n        tryIt: \"Move the throttle from idle to full: more fuel used → float drops → the needle valve opens wider.\" },\n      { kicker: \"Reference pressure\", title: \"Float chamber vent\", hl: [\"vent\", \"chamber\"], sc: { eng: true, thr: 55, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"An opening above the fuel that connects the chamber to atmosphere (in many designs to the air intake, a ‘balanced’ float chamber).\" },\n          { k: \"When it works\", v: \"Always. Air flows in as fuel is used, so the pressure above the fuel stays at ambient (intake) pressure.\" },\n          { k: \"Why it matters\", v: \"Ambient pressure on the fuel surface is what pushes fuel towards the low-pressure venturi. It is the reference for all the metering.\" }\n        ],\n        keys: [\n          { id: 'Q122', q: 'Operating principle of the float-type carburettor', a: 'difference in air pressure at the venturi throat and the air inlet.' }\n        ],\n        tryIt: \"Note ‘p ≈ ambient’ above the fuel and compare it with the low pressure (dark zone) in the throat.\" },\n      { kicker: \"Engine stopped\", title: \"Float chamber + jet = U-tube\", hl: [\"utube\"], sc: { eng: false, thr: 20, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"The float chamber and the discharge nozzle are joined at the bottom, so they behave as a U-tube: with no airflow the fuel stands at the same level in both.\" },\n          { k: \"When it applies\", v: \"Engine stopped, or no airflow through the venturi.\" },\n          { k: \"Why it matters\", v: \"The nozzle lip is set slightly ABOVE the float-chamber level, so fuel cannot dribble out with the engine stopped. Fuel only leaves when venturi depression lifts it over the lip.\" }\n        ],\n        keys: [],\n        tryIt: \"The engine is stopped. Press Start engine and watch the fuel climb over the lip and spray.\" },\n      { kicker: \"Metering force\", title: \"Throat (venturi)\", hl: [\"venturi\"], sc: { eng: true, thr: 70, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A smooth narrowing of the choke tube. The main discharge nozzle sits at its narrowest point.\" },\n          { k: \"When it works\", v: \"Whenever air flows through it. The depression grows with the square of the air velocity.\" },\n          { k: \"Why it matters\", v: \"Bernoulli: in the throat velocity rises and static pressure falls. The difference between float-chamber pressure (ambient) and throat pressure drives the fuel. More air → more depression → more fuel: the metering is automatic.\" }\n        ],\n        keys: [\n          { id: 'Q162', q: 'Purpose of the venturi', a: 'create the suction necessary to cause fuel to flow through the carburettor main jets (trap: NOT a pressure rise).' },\n          { id: 'Q89', q: 'Cause of the low temperature that forms carb ice', a: 'vaporization of fuel and expansion of the air in the carburettor.' },\n          { id: 'Q30', q: 'Carb icing possible with OAT between +9 and +27 °C?', a: 'yes, the temperature drop can cause ice at relatively high OAT if humidity is sufficient.' },\n          { id: 'Q18 / Q28', q: 'Carb icing “typically below −10 °C” / “often at 5–20 °C and above”', a: 'first incorrect, second correct.' },\n          { id: 'Q81', q: 'Induction system icing', a: 'ice accretion affects both fuel injection systems and engines equipped with carburettors.' }\n        ],\n        tryIt: \"Increase the throttle and watch the dark low-pressure zone and the depression bar grow.\" },\n      { kicker: \"Main metering\", title: \"Main jet and discharge nozzle\", hl: [\"jet\"], sc: { eng: true, thr: 70, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A calibrated main jet limits the fuel flow; the discharge nozzle delivers it into the centre of the throat, where the depression is greatest.\" },\n          { k: \"When it works\", v: \"From low/medium power up to full power, once the venturi depression is strong enough to lift fuel over the nozzle lip.\" },\n          { k: \"Why it matters\", v: \"Fuel flow follows the pressure difference float chamber → throat, so it rises and falls with the airflow. The jet size sets the basic mixture strength.\" }\n        ],\n        keys: [\n          { id: 'Q106', q: 'Float carburettor: what creates the pressure differential and where the fuel flows', a: '(1) venturi; (2) open discharge line.' }\n        ],\n        tryIt: \"Compare the fuel spray at 30 % and at 90 % throttle.\" },\n      { kicker: \"Mixture compensation\", title: \"Diffuser (air bleed)\", hl: [\"diffuser\"], sc: { eng: true, thr: 80, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A perforated tube in the fuel passage below the nozzle. An air bleed, taken from the intake at a higher-pressure point, feeds air through its holes into the fuel.\" },\n          { k: \"When it works\", v: \"Progressively as airflow increases: the fuel level in the diffuser drops, uncovering more holes and admitting more air.\" },\n          { k: \"Why it matters\", v: \"A simple carburettor gets RICHER as the airflow increases. The diffuser bleeds in air to cancel this and keep the mixture constant. It also emulsifies the fuel for better atomisation.\" }\n        ],\n        keys: [\n          { id: 'Q78', q: 'Device that keeps a constant mixture at low and high power', a: 'a diffuser (compensating jet).' },\n          { id: 'Q141', q: 'Function of the diffuser (compensating jet)', a: 'maintain a constant mixture at low and high power settings.' },\n          { id: 'Q133', q: 'Function of the diffuser, “prevent” wording', a: 'prevent the mixture from becoming too rich at high power settings.' }\n        ],\n        tryIt: \"Open the throttle: air bubbles join the fuel in the diffuser before it is sprayed into the throat.\" },\n      { kicker: \"Pilot control 1\", title: \"Throttle butterfly — what the throttle moves\", hl: [\"butterfly\", \"linkage\"], sc: { eng: true, thr: 50, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A disc on a spindle in the choke tube, downstream of the venturi. The throttle lever (in most piston helicopters the twist-grip on the collective) rotates it through the linkage.\" },\n          { k: \"When it works\", v: \"With every throttle movement. The same linkage also works the accelerator pump and the economiser.\" },\n          { k: \"Why it matters\", v: \"It controls the QUANTITY of mixture reaching the cylinders → manifold pressure → power. It does not set the ratio: the venturi and jets keep the ratio automatically.\" }\n        ],\n        keys: [\n          { id: 'Q91', q: 'Where carburettor icing most likely occurs', a: 'venturi and the throttle valve.' },\n          { id: 'Q63 / Q101 / Q166', q: 'Effect of carburettor heat', a: 'air density decreases, the mixture becomes richer (never “leaner”).' },\n          { id: 'Q96', q: 'MAP rises shortly after carb heat is selected', a: 'ice was forming in the carburettor.' },\n          { id: 'Q163', q: 'Suspected carb icing in flight (rough running, RPM decay)', a: 'apply full carb heat and keep it ON until all ice has melted and normal operation is restored.' }\n        ],\n        tryIt: \"Move the throttle: airflow and spray change together, but the air/fuel ratio hardly moves.\" },\n      { kicker: \"Low power\", title: \"Slow-running (idle) jet\", hl: [\"idle\", \"butterfly\"], sc: { eng: true, thr: 0, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A separate idle passage with its own small jet and air bleed, discharging through a port just on the engine side of the closed butterfly edge.\" },\n          { k: \"When it works\", v: \"Throttle closed or nearly closed. Venturi airflow is too slow to lift fuel from the main jet, but the high manifold depression and the fast air through the narrow gap at the butterfly edge draw fuel from the idle port.\" },\n          { k: \"Why it matters\", v: \"It keeps the engine running smoothly at idle. As the throttle opens the idle port sees less depression and the main jet progressively takes over.\" }\n        ],\n        keys: [],\n        tryIt: \"Close the throttle fully: the main spray almost stops and fuel now comes from the idle port above the butterfly edge.\" },\n      { kicker: \"Rapid opening\", title: \"Accelerator pump\", hl: [\"pump\", \"linkage\"], sc: { eng: true, thr: 10, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A small piston pump in the float chamber, driven by the throttle linkage. When the piston goes down it squirts extra fuel into the feed to the jet.\" },\n          { k: \"When it works\", v: \"Only on RAPID throttle opening. On slow movements fuel leaks past the piston (or through a bleed) and nothing is injected.\" },\n          { k: \"Why it matters\", v: \"When the throttle is snapped open, air (light) speeds up at once but fuel (heavy, high inertia) lags → momentary weak mixture → hesitation or weak cut. The squirt covers that lag.\" }\n        ],\n        keys: [\n          { id: 'Q104', q: 'Function of the accelerator pump', a: 'enable proper functioning of a piston engine during rapid throttle advance.' },\n          { id: 'Q165', q: 'Device for proper running during rapid throttle advance', a: 'an accelerator pump (the mixture control is NOT for acceleration).' }\n        ],\n        tryIt: \"Press Snap throttle open and watch the piston. Then open the throttle slowly with the slider: no squirt.\" },\n      { kicker: \"High power\", title: \"Economiser (power enrichment)\", hl: [\"econ\", \"linkage\"], sc: { eng: true, thr: 95, mix: 100, alt: 0 },\n        rows: [\n          { k: \"What it is\", v: \"A needle valve, opened by the throttle linkage, that uncovers an extra fuel passage to the jet.\" },\n          { k: \"When it works\", v: \"Only at high power, in the last ≈ 10–15 % of throttle travel. Closed in cruise.\" },\n          { k: \"Why it matters\", v: \"Extra fuel at high power cools the cylinders (latent heat of vaporisation) and prevents detonation. Closed in cruise, the engine can run on a leaner, economical mixture: hence ‘economiser’.\" }\n        ],\n        keys: [],\n        tryIt: \"Move the throttle above and below 85 %: the yellow needle lifts and the ratio moves into the rich band.\" },\n      { kicker: \"Pilot control 2\", title: \"Mixture control — what the mixture lever moves\", hl: [\"mixture\"], sc: { eng: true, thr: 60, mix: 100, alt: 8000 },\n        rows: [\n          { k: \"What it is\", v: \"Needle type (shown): the mixture lever moves a needle in the main metering jet, varying how much fuel can reach the nozzle. Back-suction type: a valve varies the pressure above the fuel in the float chamber instead.\" },\n          { k: \"When it is used\", v: \"FULL RICH for start, take-off, climb and high power. LEANED in cruise as per the flight manual. IDLE CUT-OFF to stop the engine.\" },\n          { k: \"Why it matters\", v: \"With altitude the air density falls but the carburettor meters by pressure difference, so the mixture gets progressively RICHER. Leaning restores the correct ratio and avoids plug fouling. Over-leaning at high power → high CHT and detonation. Idle cut-off starves the engine so it stops with no fuel left in the cylinders.\" }\n        ],\n        keys: [\n          { id: 'Q20', q: 'Main purpose of the mixture control', a: 'adjust the fuel flow to obtain the correct fuel/air ratio.' },\n          { id: 'Q95', q: 'Purpose of an altitude mixture control', a: 'correct for variations in the fuel/air ratio due to decreased air density at altitude.' },\n          { id: 'Q16 / Q119', q: 'Altitude increase without mixture adjustment', a: 'air density decreases while fuel flow stays too high: mixture too RICH.' },\n          { id: 'Q51', q: 'Mixture adjustment as altitude increases', a: 'reduce the fuel flow to compensate for the decreasing air density.' },\n          { id: 'Q37', q: 'Mixture lever moved towards lean', a: 'the amount of fuel entering the cylinders is reduced.' },\n          { id: 'Q15', q: 'Continuous climb with the mixture fully rich', a: 'fouling of spark plugs.' },\n          { id: 'Q41', q: 'Excessive leaning for economy cruise', a: 'high cylinder head temperature.' }\n        ],\n        tryIt: \"You are at 8,000 ft, full rich: too rich. Lean until the marker is back in best power, then pull to idle cut-off.\" },\n      { kicker: \"Summary\", title: \"Throttle vs mixture\", hl: [\"butterfly\", \"mixture\", \"linkage\"], sc: { eng: true, thr: 60, mix: 75, alt: 0 },\n        rows: [\n          { k: \"Throttle lever moves\", v: \"The butterfly: QUANTITY of mixture → manifold pressure → power. Through the same linkage: the accelerator pump on rapid opening and the economiser near full throttle.\" },\n          { k: \"Mixture lever moves\", v: \"The mixture needle in the main metering jet: QUALITY, the air/fuel ratio. Fully aft = idle cut-off.\" },\n          { k: \"Automatic, no pilot input\", v: \"Float + needle valve (constant level) · venturi depression (fuel follows airflow) · diffuser (compensation) · slow-running → main jet changeover.\" }\n        ],\n        keys: [\n          { id: 'Memory', q: 'Carburettor', a: 'venturi = suction · diffuser = constant mixture · accelerator pump = rapid throttle · strainer upstream of needle valve.' },\n          { id: 'Trap', q: 'Altitude makes the mixture…', a: 'RICH, never lean. The fix is always “reduce fuel flow”; the mixture control never adjusts air.' },\n          { id: 'Trap', q: 'Carb heat', a: 'less dense air → richer mixture. Never “leaner”.' }\n        ],\n        tryIt: \"Free play: fly the levers and check each system in the panel under the diagram.\" }\n    ];\n  }\n\n  componentWillUnmount() {\n    this.timers.forEach((id) => clearTimeout(id));\n  }\n\n  firePump() {\n    if (!this.state.eng) return;\n    if (this.pumpTimer) clearTimeout(this.pumpTimer);\n    this.setState({ pumpOn: true });\n    this.pumpTimer = setTimeout(() => this.setState({ pumpOn: false }), 1200);\n    this.timers.push(this.pumpTimer);\n  }\n\n  setThr(v) {\n    const now = Date.now();\n    this.hist = this.hist.filter((h) => now - h.t < 350);\n    this.hist.push({ v: this.state.thr, t: now });\n    let minV = 100;\n    this.hist.forEach((h) => { if (h.v < minV) minV = h.v; });\n    if (v - minV >= 25) { this.hist = []; this.firePump(); }\n    this.setState({ thr: v });\n  }\n\n  snap() {\n    this.hist = [];\n    this.setState({ thr: 5, eng: true, mix: Math.max(this.state.mix, 60) });\n    const id = setTimeout(() => { this.setState({ thr: 100 }); this.firePump(); }, 700);\n    this.timers.push(id);\n  }\n\n  go(i) {\n    const st = this.STEPS[i];\n    this.hist = [];\n    this.setState({ step: i, eng: st.sc.eng, thr: st.sc.thr, mix: st.sc.mix, alt: st.sc.alt, pumpOn: false });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));\n    const steps = this.STEPS;\n    const st = steps[s.step];\n    const t = s.thr / 100, m = s.mix / 100, alt = s.alt;\n\n    const sigma = Math.pow(1 - 6.8756e-6 * alt, 4.2559);\n    const fuelOn = m > 0.04;\n    let afr = 12 / (0.45 + 0.55 * m) * Math.sqrt(sigma);\n    if (t > 0.85) afr *= 0.9;\n    if (t < 0.15) afr *= 0.93;\n    const burnable = fuelOn && afr >= 8 && afr <= 20;\n    const running = s.eng && burnable;\n\n    const a = running ? 0.12 + 0.88 * t : 0;\n    const dp = a * a;\n    const mainOp = running ? 0.15 + 0.85 * clamp((t - 0.1) / 0.5, 0, 1) : 0;\n    const mainOp2 = running ? clamp((t - 0.45) / 0.4, 0, 1) : 0;\n    const idleOp = running ? clamp((0.32 - t) / 0.22, 0, 1) : 0;\n    const idleOn = idleOp > 0.05;\n    const mainOn = running && t >= 0.15;\n    const econOn = running && t > 0.85;\n    const pumpOn = s.pumpOn && running;\n    const demand = running ? a * (0.5 + 0.5 * m) : 0;\n    const needleLift = running ? 3 + 9 * demand : 0;\n    const lvl = Math.round((480 + demand * 4) * 10) / 10;\n    const vcls = !running ? \"v0\" : a < 0.3 ? \"v1\" : a < 0.55 ? \"v2\" : a < 0.8 ? \"v3\" : \"v4\";\n    const riserTop = running ? 456 : lvl;\n\n    const zone = (x) => x < 8 ? [\"Too rich\", \"Rich cut: mixture will not burn.\"]\n      : x < 11 ? [\"Rich\", \"≈ 10:1 is the take-off mixture: extra fuel for cooling and detonation margin.\"]\n      : x < 13.5 ? [\"Best power\", \"≈ 12:1 — maximum power for the airflow.\"]\n      : x < 15.5 ? [\"Chemically correct\", \"≈ 15:1 — all fuel and oxygen used, hottest combustion.\"]\n      : x < 17 ? [\"Best economy\", \"≈ 16:1 — cruise, leaned as per the flight manual.\"]\n      : x <= 20 ? [\"Lean\", \"High CHT and detonation risk at high power.\"]\n      : [\"Too lean\", \"Weak cut: mixture will not burn.\"];\n    const z = zone(afr);\n\n    let status, statusSub, statusColor;\n    if (!s.eng) { status = \"Engine stopped\"; statusSub = \"No airflow, no depression: fuel rests at the U-tube level, just below the jet lip.\"; statusColor = \"#475569\"; }\n    else if (!fuelOn) { status = \"Stopped — idle cut-off\"; statusSub = \"Mixture needle closed: no fuel reaches the jets, so the engine stops with no fuel left in the cylinders.\"; statusColor = \"#B91C1C\"; }\n    else if (afr > 20) { status = \"Stopped — weak cut\"; statusSub = \"Mixture leaner than ≈ 20:1 will not burn. Move the mixture richer and start again.\"; statusColor = \"#B91C1C\"; }\n    else if (afr < 8) { status = \"Stopped — rich cut\"; statusSub = \"Mixture richer than ≈ 8:1 will not burn.\"; statusColor = \"#B91C1C\"; }\n    else { status = \"Running · \" + z[0]; statusSub = z[1] + (alt > 0 && m > 0.95 ? \" At altitude, full rich gets richer: lean to correct.\" : \"\"); statusColor = \"#15803D\"; }\n\n    const keys = [\"inlet\", \"filter\", \"chamber\", \"float\", \"needle\", \"vent\", \"venturi\", \"jet\", \"utube\", \"diffuser\", \"butterfly\", \"idle\", \"pump\", \"econ\", \"mixture\", \"linkage\"];\n    const hl = {}, lb = {};\n    keys.forEach((k) => { const on = st.hl.indexOf(k) >= 0; hl[k] = on ? \"on\" : \"\"; lb[k] = on ? \"strong\" : \"\"; });\n\n    const chip = (name, on) => ({ name: name, cls: on ? \"chip on\" : \"chip\" });\n    const chips = [\n      chip(\"Needle valve \" + (needleLift > 0 ? \"open\" : \"closed\"), needleLift > 0),\n      chip(\"Main jet\", mainOn),\n      chip(\"Slow-running jet\", idleOn),\n      chip(\"Diffuser air bleed\", running && t > 0.3),\n      chip(\"Accelerator pump\", pumpOn),\n      chip(\"Economiser\", econOn)\n    ];\n\n    const dots = steps.map((x, i) => ({ n: i + 1, aria: \"Step \" + (i + 1) + \": \" + x.title, cls: i === s.step ? \"dot on\" : \"dot\", go: () => this.go(i) }));\n\n    return {\n      thr: s.thr, mix: s.mix, alt: s.alt,\n      onThr: (e) => this.setThr(Number(e.target.value)),\n      onMix: (e) => this.setState({ mix: Number(e.target.value) }),\n      onAlt: (e) => this.setState({ alt: Number(e.target.value) }),\n      toggleEng: () => this.setState({ eng: !s.eng }),\n      toggleLabels: () => this.setState({ labels: !s.labels }),\n      snap: () => this.snap(),\n      prev: () => this.go(Math.max(0, s.step - 1)),\n      next: () => this.go(Math.min(steps.length - 1, s.step + 1)),\n      atStart: s.step === 0,\n      atEnd: s.step === steps.length - 1,\n      thrLabel: s.thr === 0 ? \"Closed (idle)\" : s.thr === 100 ? \"Full open\" : s.thr + \" %\",\n      mixLabel: m <= 0.04 ? \"Idle cut-off\" : s.mix === 100 ? \"Full rich\" : s.mix + \" % (leaned)\",\n      altLabel: alt === 0 ? \"Sea level\" : alt.toLocaleString(\"en-GB\") + \" ft\",\n      engCls: s.eng ? \"stop\" : \"run\",\n      engText: s.eng ? \"Stop engine\" : \"Start engine\",\n      engPressed: s.eng ? \"true\" : \"false\",\n      labelsText: s.labels ? \"Hide labels\" : \"Show labels\",\n      labelsPressed: s.labels ? \"true\" : \"false\",\n      labelsCls: s.labels ? \"\" : \"hide\",\n      status: status, statusSub: statusSub, statusColor: statusColor,\n      airPct: Math.round(a * 100),\n      dpPct: Math.round(dp * 100),\n      afrText: running ? afr.toFixed(1) + \" : 1\" : \"—\",\n      afrPos: (clamp((afr - 6) / 16, 0, 1) * 100).toFixed(1),\n      afrMarkOp: running ? 1 : 0,\n      zoneName: running ? z[0] : \"—\",\n      chips: chips,\n      vcls: vcls,\n      lpOp: (dp * 0.32).toFixed(3),\n      lvl: lvl,\n      fuelH: Math.round((620 - lvl) * 10) / 10,\n      riserTop: riserTop,\n      riserH: Math.round((670 - riserTop) * 10) / 10,\n      idleD: idleOn ? \"M720 677 L720 290 L744 290\" : \"M720 677 L720 \" + lvl,\n      mainOp: mainOp.toFixed(2),\n      mainOp2: mainOp2.toFixed(2),\n      idleOp: idleOp.toFixed(2),\n      burstOp: pumpOn ? 1 : 0,\n      bubOp: running ? clamp((t - 0.25) / 0.4, 0, 1).toFixed(2) : 0,\n      ffIn: needleLift > 4 ? \"on\" : \"\",\n      ffMain: running && mainOp > 0.2 ? \"on\" : \"\",\n      ffIdle: idleOn ? \"on\" : \"\",\n      ffEcon: econOn ? \"on\" : \"\",\n      ffPump: pumpOn ? \"on\" : \"\",\n      floatRot: (needleLift * 0.45).toFixed(2),\n      needleLift: needleLift.toFixed(1),\n      mixLift: (m * 18).toFixed(1),\n      econLift: t > 0.85 ? 14 : 0,\n      pumpY: pumpOn ? 28 : 0,\n      springScale: pumpOn ? 0.4 : 1,\n      bfDeg: (-(8 + 72 * t)).toFixed(1),\n      utubeOp: running ? 0 : 1,\n      utubeTextY: lvl - 8,\n      hl: hl, lb: lb,\n      kicker: st.kicker, title: st.title, rows: st.rows,\n      keys: st.keys || [], hasExam: !!(st.keys && st.keys.length), tryIt: st.tryIt,\n      stepNo: s.step + 1, stepCount: steps.length,\n      dots: dots\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
